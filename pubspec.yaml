name: convert_midi
description: "MIDI Bluetooth Streamer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Existing
  flutter_blue_plus: ^2.3.2
  permission_handler: ^12.0.1
  dart_midi_pro: ^1.0.4+2
  bluetooth_classic: ^0.0.4
  path_provider: ^2.1.4

  # Base template
  rxdart: ^0.28.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.1.3
  fluttertoast: ^8.2.8
  overlay_support: ^2.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  device_info_plus: ^11.1.0
  auto_size_text_plus: ^3.0.1
  package_info_plus: ^8.0.0
  dio: ^5.7.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
    - assets/json/
    - assets/image/
    - assets/icon/
    - assets/font/
    - assets/sound/
    - assets/language/
